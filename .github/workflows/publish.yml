name: Publish package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Check out the release ref
        uses: actions/checkout@v6

      - name: Use Node.js
        # v7 does not create setup-node's legacy dummy NODE_AUTH_TOKEN,
        # allowing npm to select its GitHub OIDC trusted-publishing flow.
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Require main for manual releases
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Verify the release tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          package_version="$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "v$package_version"

      - name: Install dependencies
        run: npm ci

      - name: Test the release artifact
        run: npm test

      - name: Enable npm trusted publishing
        run: |
          sed -i '/_authToken/d' "${NPM_CONFIG_USERCONFIG:?missing npm user config}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"

      - name: Publish
        run: npm publish
