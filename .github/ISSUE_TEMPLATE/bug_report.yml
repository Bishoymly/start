name: Bug report
description: Report incorrect, unsafe, or non-deterministic Start behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Start. Remove credentials and secrets from all output.
  - type: input
    id: version
    attributes:
      label: Start version
      placeholder: 0.4.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, and package manager.
    validations:
      required: true
  - type: textarea
    id: blueprint
    attributes:
      label: Blueprint or choices
      description: Share the blueprint token or the relevant choices. Do not include secrets.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
